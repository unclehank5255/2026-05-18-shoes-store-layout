<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mina:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- import Montserrat font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/all.css">
</head>
<!--demo version-->

<body>
    <header>
        <nav class="navbar-desktop container">
            <div class="navbar__menu">
                <h1>
                    <a href="index.html" class="navbar__brand">
                        <img src="assets/logo.svg" alt="URBNSTEP's logo">
                        <span class="sr-only">URBNSTEP</span>
                    </a>
                </h1>
                <ul class="navbar__nav">
                    <li><a href="products.html" class="navbar__link">商品列表</a></li>
                    <li><a href="story.html" class="navbar__link">品牌故事</a></li>
                </ul>
            </div>
            <a href="login.html" class="navbar__icon"><i class="bi bi-person"></i></a>
        </nav>

        <!--header mobile section-->
        <nav class="navbar-mobile">
            <ul class="navbar__nav">
                <li><a href="products.html" class="navbar__link navbar__link-product">商品列表</a></li>
                <li><a href="story.html" class="navbar__link navbar__link-story">品牌故事</a></li>
            </ul>
        </nav>
    </header>
    <main></main>
    <footer>
        <div class="container">
            <div class="navbar-desktop">
                <a href="index.html" class="navbar__brand">
                    <img src="assets/logo.svg" alt="URBNSTEP's logo" class="navbar__logo">
                    <span class="sr-only">URBNSTEP</span>
                </a>
                <nav>
                    <ul class="navbar__nav">
                        <li><a href="products.html" class="navbar__link">商品列表</a></li>
                        <li><a href="story.html" class="navbar__link">品牌故事</a></li>
                    </ul>
                </nav>
            </div>
            <div class="copyright">
                <p>Copyright ©2025 URBNSTYLE</p>
                <p>All Rights Reserved.</p>
            </div>
        </div>
    </footer>
    <!-- 按鈕 -->
    <section>
        <button class="btn btn--sm btn--primary">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--primary">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--primary" disabled>
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--sm btn--filled">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--filled">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--filled" disabled>
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--sm btn--neutral">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--neutral">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--neutral" disabled>
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
    </section>
    <!-- icon按鈕 -->
    <section>
        <button class="icon-btn icon-btn--lg icon-btn--outlined">
            <i class="bi bi-handbag"></i>
        </button>
        <button class="icon-btn icon-btn--sm icon-btn--outlined">
            <i class="bi bi-handbag"></i>
        </button>
        <button class="icon-btn icon-btn--lg icon-btn--transparent">
            <i class="bi bi-handbag"></i>
            <span class="icon-btn__badge icon-btn__badge--lg">1</span>
        </button>
        <button class="icon-btn icon-btn--sm icon-btn--transparent">
            <i class="bi bi-handbag"></i>
            <span class="icon-btn__badge icon-btn__badge--sm">1</span>
        </button>
    </section>
    <!-- card設計區 -->
    <section class="container">
        <article class="card-product card-product--lg">
            <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week3-4/new-1.png"
                alt="#" class="card-product__img">
            <div class="card-product__info">
                <h5>SUGAR SNAP</h5>
                <p>NT $2,600</p>
            </div>
        </article>
        <article class="card-product card-product--md">
            <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week3-4/new-1.png"
                alt="#" class="card-product__img">
            <div class="card-product__info">
                <h6>SUGAR SNAP</h6>
                <p>NT $2,600</p>
            </div>
        </article>
        <article class="card-product card-product--sm">
            <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week3-4/new-1.png"
                alt="#" class="card-product__img">
            <div class="card-product__info">
                <h6>SUGAR SNAP</h6>
                <p>NT $2,600</p>
            </div>
        </article>

        <article class="card-image card-image--lg">
            <span class="card-image__badge">人氣 No.1</span>
            <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week2/product-3.png"
                alt="#" class="card-image__img">
        </article>
        <article class="card-image  card-image--sm">
            <span class="card-image__badge">人氣 No.1</span>
            <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week2/product-3.png"
                alt="#" class="card-image__img">
        </article>

        <article class="card-category card-category--lg">
            <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week2/product-6.png"
                alt="#" class="card-category__img">
            <div class="card-category__overlay">
                <h3>URBN RUNNER</h3>
                <p>慢跑系列</p>
            </div>
        </article>
        <article class="card-category card-category--sm">
            <img src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week2/product-6.png"
                alt="#" class="card-category__img">
            <div class="card-category__overlay">
                <h6>URBN RUNNER</h6>
                <p>慢跑系列</p>
            </div>
        </article>
    </section>
    <!-- link設計區 -->
    <section class="link-design">
        <button href="products.html" class="link link--primary">
            <i class="bi bi-arrow-left"></i>
            <span class="link__text">立即選購</span>
        </button>
        <button href="products.html" class="link link--primary">
            <span class="link__text">立即選購</span>
            <i class="bi bi-arrow-right"></i>
        </button>
        <button href="products.html" class="link link--primary">
            <span class="link__text">立即選購</span>
        </button>
        <button href="products.html" class="link link--primary" disabled>
            <span class="link__text">立即選購</span>
        </button>
        <button href="products.html" class="link link--neutral">
            <i class="bi bi-arrow-left"></i>
            <span class="link__text">立即選購</span>
        </button>
        <button href="products.html" class="link link--neutral">
            <span class="link__text">立即選購</span>
            <i class="bi bi-arrow-right"></i>
        </button>
        <button href="products.html" class="link link--neutral">
            <span class="link__text">立即選購</span>
        </button>
        <button href="products.html" class="link link--neutral" disabled>
            <span class="link__text">立即選購</span>
        </button>
    </section>
</body>

</html>
