<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mina:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/all.css">
</head>
<!--demo version-->

<body>
    <header>
        <nav class="navbar-desktop container">
            <div class="navbar__menu">
                <h1>
                    <a href="index.html" class="navbar__brand">
                        <img src="assets/logo.svg" alt="URBNSTEP's logo">
                        <span class="sr-only">URBNSTEP</span>
                    </a>
                </h1>
                <ul class="navbar__nav">
                    <li><a href="products.html" class="navbar__link">商品列表</a></li>
                    <li><a href="story.html" class="navbar__link">品牌故事</a></li>
                </ul>
            </div>
            <a href="login.html" class="navbar__icon"><i class="bi bi-person"></i></a>
        </nav>

        <!--header mobile section-->
        <nav class="navbar-mobile">
            <ul class="navbar__nav">
                <li><a href="products.html" class="navbar__link navbar__link-product">商品列表</a></li>
                <li><a href="story.html" class="navbar__link navbar__link-story">品牌故事</a></li>
            </ul>
        </nav>
    </header>
    <main></main>
    <footer>
        <div class="container">
            <div class="navbar-desktop">
                <a href="index.html" class="navbar__brand">
                    <img src="assets/logo.svg" alt="URBNSTEP's logo" class="navbar__logo">
                    <span class="sr-only">URBNSTEP</span>
                </a>
                <nav>
                    <ul class="navbar__nav">
                        <li><a href="products.html" class="navbar__link">商品列表</a></li>
                        <li><a href="story.html" class="navbar__link">品牌故事</a></li>
                    </ul>
                </nav>
            </div>
            <div class="copyright">
                <p>Copyright ©2025 URBNSTYLE</p>
                <p>All Rights Reserved.</p>
            </div>
        </div>
    </footer>
    <section class="按鈕">
        <button class="btn btn--sm btn--primary">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--primary">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>

        <button class="btn btn--sm btn--filled">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--filled">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>

        <button class="btn btn--sm btn--neutral">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn--lg btn--neutral">
            立即選購
            <i class="bi bi-arrow-right"></i>
        </button>
    </section>
    <section class="icon按鈕">
        <button class="icon-btn icon-btn--lg icon-btn--outlined">
            <i class="bi bi-handbag"></i>
        </button>
        <button class="icon-btn icon-btn--sm icon-btn--outlined">
            <i class="bi bi-handbag"></i>
        </button>
        <button class="icon-btn icon-btn--lg icon-btn--transparent">
            <i class="bi bi-handbag"></i>
            <span class="icon-btn__badge icon-btn__badge--lg">1</span>
        </button>
        <button class="icon-btn icon-btn--sm icon-btn--transparent">
            <i class="bi bi-handbag"></i>
            <span class="icon-btn__badge icon-btn__badge--sm">1</span>
        </button>
    </section>
</body>

</html>
